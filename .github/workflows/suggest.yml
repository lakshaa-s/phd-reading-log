name: Weekly paper suggestions

on:
  schedule:
    - cron: '17 6 * * 1'      # Mondays 06:17 UTC (06:17 London in winter, 07:17 in summer)
  workflow_dispatch:           # also lets you run it now from the Actions tab
    inputs:
      days:
        description: 'How many days back to search'
        required: false
        default: '7'

permissions:
  contents: write

concurrency:
  group: reading-log-suggestions
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find papers
        run: python scripts/suggest.py --days "${{ github.event.inputs.days || '7' }}"
      - name: Commit suggestions
        run: |
          git config user.name "reading-log bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suggestions.csv
          if git diff --cached --quiet; then echo "No new suggestions"; exit 0; fi
          git commit -m "Reading log: suggestions for week of $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
